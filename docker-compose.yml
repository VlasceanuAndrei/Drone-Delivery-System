services:
  postgres:
    image: postgres:16
    container_name: drone-delivery-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - drone_delivery_pgdata:/var/lib/postgresql/data

volumes:
  drone_delivery_pgdata:
